name: Flow 4-Auction Reserve Not Met Counter Accepted Settlement

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-auction-flow4
  cancel-in-progress: false

jobs:
  # =========================================================
  # RUN FLOW 4 TEST
  # =========================================================

  run-flow4:
    name: Run Flow 4 Test

    runs-on: ubuntu-latest

    # Auction wait + negotiation + settlement can take time
    timeout-minutes: 60

    env:
      # ===============================================
      # GITHUB MODE
      # ===============================================

      CI: "true"
      HEADLESS: "true"
      SLOW_MO: "0"

      # ===============================================
      # APPLICATION
      # ===============================================

      BASE_URL: ${{ secrets.BASE_URL }}

      # ===============================================
      # AGENT
      # ===============================================

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      # ===============================================
      # GENERAL USER / AUCTION BUYER
      # ===============================================

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      # ===============================================
      # PAYMENT
      # ===============================================

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Browser
        run: |
          npx playwright install --with-deps chromium

      # =====================================================
      # INSTALL GOOGLE CHROME
      # hooks.js uses channel: "chrome"
      # =====================================================

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get update

          sudo apt-get install -y \
            ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify environment
        run: |
          node --version

          npm --version

          npx playwright --version

          npx cucumber-js --version

          npx allure --version

          google-chrome --version

      # =====================================================
      # CLEAN OLD OUTPUT
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results

          rm -rf allure-report

          rm -rf reports/cucumber

          rm -rf screenshots/cucumber

          rm -rf videos

      # =====================================================
      # RUN ONLY FLOW 4
      # =====================================================

      - name: Run Flow 4 Cucumber Test
        id: cucumber-tests

        continue-on-error: true

        run: |
          npx cucumber-js --tags "@reserve-not-met and @counter-offer and @settlement"

      # =====================================================
      # GENERATE ALLURE REPORT
      # =====================================================

      - name: Generate Allure Report
        if: always()

        run: |
          if [ -d "allure-results" ] && \
             [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating Flow 4 Allure report..."

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results generated."

            mkdir -p allure-report

            echo "<h1>No Allure results generated</h1>" \
              > allure-report/index.html

          fi

      # =====================================================
      # CUCUMBER REPORT
      # =====================================================

      - name: Upload Flow 4 Cucumber Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: flow4-cucumber-report
          path: reports/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # ALLURE RAW RESULTS
      # =====================================================

      - name: Upload Flow 4 Allure Raw Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: flow4-allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # ALLURE HTML REPORT
      # =====================================================

      - name: Upload Flow 4 Allure HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: flow4-allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # SCREENSHOTS
      # =====================================================

      - name: Upload Flow 4 Screenshots
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: flow4-cucumber-screenshots
          path: screenshots/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # VIDEOS
      # =====================================================

      - name: Upload Flow 4 Test Videos
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: flow4-cucumber-videos
          path: videos/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()

        uses: actions/configure-pages@v5

      - name: Upload Flow 4 Allure Report To GitHub Pages
        if: always()

        uses: actions/upload-pages-artifact@v4

        with:
          path: allure-report/

      # =====================================================
      # DISPLAY TEST RESULT
      # =====================================================

      - name: Display Flow 4 Test Result
        if: always()

        run: |
          echo ""
          echo "============================================"
          echo "REALEY FLOW 4 AUTOMATION"
          echo "============================================"
          echo "Auction Reserve Price Not Met"
          echo "Counter Offer Accepted"
          echo "Settlement Completed"
          echo "============================================"
          echo "Result: ${{ steps.cucumber-tests.outcome }}"
          echo "============================================"

      # =====================================================
      # FAIL JOB IF TEST FAILED
      # =====================================================

      - name: Fail Job If Flow 4 Test Failed
        if: steps.cucumber-tests.outcome == 'failure'

        run: |
          echo "Flow 4 Cucumber test failed."

          exit 1


  # =========================================================
  # DEPLOY ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Flow 4 Allure Report

    if: always()

    needs:
      - run-flow4

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Flow 4 Allure Report
        id: deployment

        uses: actions/deploy-pages@v4

      - name: Show Flow 4 Allure Report URL
        run: |
          echo ""
          echo "============================================"
          echo "FLOW 4 ALLURE REPORT"
          echo "============================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================"

      - name: Add Flow 4 Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Flow 4 Allure Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Report includes:" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent login" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent creates Auction listing" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer login" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer bidder registration" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer places bid below reserve" >> "$GITHUB_STEP_SUMMARY"

          echo "- Auction end wait" >> "$GITHUB_STEP_SUMMARY"

          echo "- Reserve Price Not Met" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent starts negotiation" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent sends counter offer" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer sends counter negotiation" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent accepts buyer counter" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer starts settlement" >> "$GITHUB_STEP_SUMMARY"

          echo "- Deposit payment" >> "$GITHUB_STEP_SUMMARY"

          echo "- Personal Details" >> "$GITHUB_STEP_SUMMARY"

          echo "- Solicitor selection" >> "$GITHUB_STEP_SUMMARY"

          echo "- Mortgage Broker selection" >> "$GITHUB_STEP_SUMMARY"

          echo "- Complete Setup" >> "$GITHUB_STEP_SUMMARY"

          echo "- Step screenshots" >> "$GITHUB_STEP_SUMMARY"

          echo "- Recorded Playwright scenario video" >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final Flow 4 Test Status

    if: always()

    needs:
      - run-flow4
      - deploy-allure

    runs-on: ubuntu-latest

    steps:
      - name: Workflow Summary
        run: |
          echo "Flow 4 automation workflow completed."