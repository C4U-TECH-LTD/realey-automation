name: Stag flow check 1,2,4,5,8

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-stag-flow-check-1-2-4-5-8
  cancel-in-progress: false

jobs:
  run-stag-flows:
    name: Run Staging Flows (1, 2, 4, 5, 8)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      test_outcome: ${{ steps.cucumber-tests.outcome }}
      formatted_duration: ${{ steps.duration.outputs.formatted_duration }}
      start_time: ${{ steps.timing.outputs.start_time }}

    env:
      CI: "true"
      HEADLESS: "true"
      SLOW_MO: "0"

      BASE_URL: ${{ secrets.STAG_BASE_URL != '' && secrets.STAG_BASE_URL || 'https://staging.realey.au/' }}

      AGENT_EMAIL: ${{ secrets.STAG_AGENT_EMAIL != '' && secrets.STAG_AGENT_EMAIL || 'stag.agent.c4utest@yopmail.com' }}
      AGENT_PASSWORD: ${{ secrets.STAG_AGENT_PASSWORD != '' && secrets.STAG_AGENT_PASSWORD || 'Test12345@' }}
      AGENT_OTP: ${{ secrets.STAG_AGENT_OTP != '' && secrets.STAG_AGENT_OTP || '123456' }}
      FLOW1_AGENT_EMAIL: ${{ secrets.STAG_AGENT_EMAIL != '' && secrets.STAG_AGENT_EMAIL || 'stag.agent.c4utest@yopmail.com' }}
      FLOW1_AGENT_PASSWORD: ${{ secrets.STAG_AGENT_PASSWORD != '' && secrets.STAG_AGENT_PASSWORD || 'Test12345@' }}
      FLOW1_AGENT_OTP: ${{ secrets.STAG_AGENT_OTP != '' && secrets.STAG_AGENT_OTP || '123456' }}

      GENERAL_USER_EMAIL: ${{ secrets.STAG_GENERAL_USER_EMAIL != '' && secrets.STAG_GENERAL_USER_EMAIL || 'subratotest99.3@gmail.com' }}
      GENERAL_USER_PASSWORD: ${{ secrets.STAG_GENERAL_USER_PASSWORD != '' && secrets.STAG_GENERAL_USER_PASSWORD || 'Test12345@' }}
      GENERAL_USER_OTP: ${{ secrets.STAG_GENERAL_USER_OTP != '' && secrets.STAG_GENERAL_USER_OTP || '123456' }}
      FLOW1_BUYER_EMAIL: ${{ secrets.STAG_GENERAL_USER_EMAIL != '' && secrets.STAG_GENERAL_USER_EMAIL || 'subratotest99.3@gmail.com' }}
      FLOW1_BUYER_PASSWORD: ${{ secrets.STAG_GENERAL_USER_PASSWORD != '' && secrets.STAG_GENERAL_USER_PASSWORD || 'Test12345@' }}
      FLOW1_BUYER_OTP: ${{ secrets.STAG_GENERAL_USER_OTP != '' && secrets.STAG_GENERAL_USER_OTP || '123456' }}

      SELLER_SOLICITOR_EMAIL: ${{ secrets.STAG_SELLER_SOLICITOR_EMAIL != '' && secrets.STAG_SELLER_SOLICITOR_EMAIL || 'subratotest99.2@gmail.com' }}
      SELLER_SOLICITOR_PASSWORD: ${{ secrets.STAG_SELLER_SOLICITOR_PASSWORD != '' && secrets.STAG_SELLER_SOLICITOR_PASSWORD || 'Test12345@' }}
      SELLER_SOLICITOR_OTP: ${{ secrets.STAG_SELLER_SOLICITOR_OTP != '' && secrets.STAG_SELLER_SOLICITOR_OTP || '123456' }}
      SELLER_SOLICITOR_SEARCH: ${{ secrets.STAG_SELLER_SOLICITOR_SEARCH != '' && secrets.STAG_SELLER_SOLICITOR_SEARCH || 'subratotest99.2@gmail.com' }}

      BROKER_SEARCH: ${{ secrets.STAG_BROKER_SEARCH != '' && secrets.STAG_BROKER_SEARCH || 'subrato' }}
      FLOW1_BROKER_SEARCH: ${{ secrets.STAG_BROKER_SEARCH != '' && secrets.STAG_BROKER_SEARCH || 'subrato' }}

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER != '' && secrets.TEST_CARD_NUMBER || '4242 4242 4242 4242' }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY != '' && secrets.TEST_CARD_EXPIRY || '07/28' }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC != '' && secrets.TEST_CARD_CVC || '123' }}

      FLOW2_ADDRESS: "199 William Street, Melbourne VIC, Australia"
      DEFAULT_LISTING_ADDRESS: "199 William Street, Melbourne VIC, Australia"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright Browser
        run: |
          npx playwright install --with-deps chromium

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Verify environment
        run: |
          node --version
          npm --version
          npx playwright --version
          npx cucumber-js --version
          npx allure --version
          google-chrome --version

      - name: Clean previous reports
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf reports/cucumber
          rm -rf screenshots/cucumber
          rm -rf videos

      - name: Record Start Time
        id: timing
        run: |
          echo "start_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"
          echo "start_seconds=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run Staging Cucumber Tests (Flows 1, 2, 4, 5, 8)
        id: cucumber-tests
        continue-on-error: true
        run: |
          npx cucumber-js --tags "(@flow-1 or @flow-2 or @flow-4 or @flow-5 or @flow-8)" --retry 1

      - name: Record End Time & Calculate Duration
        if: always()
        id: duration
        run: |
          end_seconds=$(date +%s)
          duration_seconds=$((end_seconds - ${{ steps.timing.outputs.start_seconds }}))
          minutes=$((duration_seconds / 60))
          seconds=$((duration_seconds % 60))
          echo "formatted_duration=${minutes}m ${seconds}s" >> "$GITHUB_OUTPUT"
          echo "end_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            echo "Generating Allure report..."
            npx allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results generated."
            mkdir -p allure-report
            echo "<h1>No Allure results generated</h1>" > allure-report/index.html
          fi

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stag-cucumber-report
          path: reports/cucumber/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stag-allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stag-allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stag-cucumber-screenshots
          path: screenshots/cucumber/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stag-cucumber-videos
          path: videos/cucumber/
          retention-days: 30
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure Report To GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

  deploy-allure:
    name: Publish Allure Report
    if: always()
    needs:
      - run-stag-flows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Staging (Flows 1, 2, 4, 5, 8) Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Execution of Flows 1, 2, 4, 5, 8 on Staging environment." >> "$GITHUB_STEP_SUMMARY"

  final-status:
    name: Final Test Status
    if: always()
    needs:
      - run-stag-flows
      - deploy-allure
    runs-on: ubuntu-latest
    steps:
      - name: Workflow Summary
        run: |
          echo "Staging Flows (1, 2, 4, 5, 8) automation workflow completed."

      - name: Check Suite Outcome
        if: always() && (needs.run-stag-flows.outputs.test_outcome == 'failure' || needs.run-stag-flows.result != 'success')
        run: |
          echo "Staging Flows (1, 2, 4, 5, 8) test run ended with failures. Check Allure Report / Job artifacts."
          exit 1
