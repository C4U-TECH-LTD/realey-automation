name: Flow 6 - Fixed Price Settlement Exchange Signing

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-fixed-price-settlement-exchange
  cancel-in-progress: false

jobs:
  # =========================================================
  # RUN FLOW 6
  # =========================================================

  run-fixed-price-settlement-exchange:
    name: Run Fixed Price Settlement Exchange Test

    runs-on: ubuntu-latest

    timeout-minutes: 60

    env:
      # ===============================================
      # GITHUB MODE
      # ===============================================

      CI: "true"

      HEADLESS: "true"

      SLOW_MO: "0"

      # ===============================================
      # APPLICATION
      # ===============================================

      BASE_URL: ${{ secrets.BASE_URL }}

      # ===============================================
      # AGENT
      # ===============================================

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      # ===============================================
      # GENERAL USER / BUYER
      # ===============================================

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      # ===============================================
      # BUYER SOLICITOR
      # ===============================================

      BUYER_SOLICITOR_EMAIL: ${{ secrets.BUYER_SOLICITOR_EMAIL }}
      BUYER_SOLICITOR_PASSWORD: ${{ secrets.BUYER_SOLICITOR_PASSWORD }}
      BUYER_SOLICITOR_OTP: ${{ secrets.BUYER_SOLICITOR_OTP }}

      # ===============================================
      # SELLER SOLICITOR
      # ===============================================

      SELLER_SOLICITOR_EMAIL: ${{ secrets.SELLER_SOLICITOR_EMAIL }}
      SELLER_SOLICITOR_PASSWORD: ${{ secrets.SELLER_SOLICITOR_PASSWORD }}
      SELLER_SOLICITOR_OTP: ${{ secrets.SELLER_SOLICITOR_OTP }}

      # ===============================================
      # VENDOR
      # ===============================================

      VENDOR_EMAIL: ${{ secrets.VENDOR_EMAIL }}
      VENDOR_PASSWORD: ${{ secrets.VENDOR_PASSWORD }}
      VENDOR_OTP: ${{ secrets.VENDOR_OTP }}

      # ===============================================
      # PAYMENT
      # ===============================================

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Browser
        run: |
          npx playwright install --with-deps chromium

      # =====================================================
      # INSTALL GOOGLE CHROME
      # hooks.js uses channel: "chrome"
      # =====================================================

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get update

          sudo apt-get install -y \
            ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify environment
        run: |
          node --version

          npm --version

          npx playwright --version

          npx cucumber-js --version

          npx allure --version

          google-chrome --version

      # =====================================================
      # CLEAN OLD OUTPUT
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results

          rm -rf allure-report

          rm -rf reports/cucumber

          rm -rf screenshots/cucumber

          rm -rf videos

      # =====================================================
      # RUN ONLY FLOW 6
      #
      # Feature tags:
      # @e2e
      # @fixed-price
      # @direct-offer
      # @settlement-exchange
      # =====================================================

      - name: Run Fixed Price Settlement Exchange Cucumber Test
        id: cucumber-tests

        continue-on-error: true

        run: |
          npx cucumber-js --tags "@e2e and @fixed-price and @direct-offer and @settlement-exchange"

      # =====================================================
      # GENERATE ALLURE REPORT
      # =====================================================

      - name: Generate Allure Report
        if: always()

        run: |
          if [ -d "allure-results" ] && \
             [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating Allure report..."

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results generated."

            mkdir -p allure-report

            echo "<h1>No Allure results generated</h1>" \
              > allure-report/index.html

          fi

      # =====================================================
      # CUCUMBER REPORT
      # =====================================================

      - name: Upload Cucumber Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-settlement-exchange-cucumber-report

          path: reports/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # ALLURE RAW RESULTS
      # =====================================================

      - name: Upload Allure Raw Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-settlement-exchange-allure-results

          path: allure-results/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # ALLURE HTML REPORT
      # =====================================================

      - name: Upload Allure HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-settlement-exchange-allure-html-report

          path: allure-report/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-settlement-exchange-cucumber-screenshots

          path: screenshots/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # RECORDED VIDEOS
      # =====================================================

      - name: Upload Test Videos
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-settlement-exchange-cucumber-videos

          path: videos/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()

        uses: actions/configure-pages@v5

      - name: Upload Allure Report To GitHub Pages
        if: always()

        uses: actions/upload-pages-artifact@v4

        with:
          path: allure-report/

      # =====================================================
      # DISPLAY TEST RESULT
      # =====================================================

      - name: Display Fixed Price Settlement Exchange Test Result
        if: always()

        run: |
          echo ""
          echo "======================================================"
          echo "REALEY FIXED PRICE SETTLEMENT EXCHANGE SIGNING"
          echo "======================================================"
          echo "Tags: @e2e @fixed-price @direct-offer @settlement-exchange"
          echo "Result: ${{ steps.cucumber-tests.outcome }}"
          echo "======================================================"

      # =====================================================
      # FAIL JOB IF CUCUMBER FAILED
      # =====================================================

      - name: Fail Job If Settlement Exchange Test Failed
        if: steps.cucumber-tests.outcome == 'failure'

        run: |
          echo "Fixed Price Settlement Exchange Cucumber test failed."

          exit 1


  # =========================================================
  # DEPLOY ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Fixed Price Settlement Exchange Allure Report

    if: always()

    needs:
      - run-fixed-price-settlement-exchange

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report
        id: deployment

        uses: actions/deploy-pages@v4

      - name: Show Allure Report URL
        run: |
          echo ""
          echo "======================================================"
          echo "FIXED PRICE SETTLEMENT EXCHANGE ALLURE REPORT"
          echo "======================================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "======================================================"

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Fixed Price Settlement Exchange Allure Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Report includes:" >> "$GITHUB_STEP_SUMMARY"

          echo "- Fixed Price listing creation and publishing" >> "$GITHUB_STEP_SUMMARY"

          echo "- General User direct offer submission" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent offer acceptance" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer settlement process" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer Solicitor selection" >> "$GITHUB_STEP_SUMMARY"

          echo "- Mortgage Broker selection" >> "$GITHUB_STEP_SUMMARY"

          echo "- Deposit payment" >> "$GITHUB_STEP_SUMMARY"

          echo "- Settlement completion" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent Ready for Exchange" >> "$GITHUB_STEP_SUMMARY"

          echo "- Seller Solicitor exchange initiation" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer document assignment" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer document signing" >> "$GITHUB_STEP_SUMMARY"

          echo "- Documents passed to Seller Solicitor" >> "$GITHUB_STEP_SUMMARY"

          echo "- Vendor added" >> "$GITHUB_STEP_SUMMARY"

          echo "- Documents passed to Vendor" >> "$GITHUB_STEP_SUMMARY"

          echo "- Vendor document signing" >> "$GITHUB_STEP_SUMMARY"

          echo "- Settlement date proposal" >> "$GITHUB_STEP_SUMMARY"

          echo "- Settlement date acceptance" >> "$GITHUB_STEP_SUMMARY"

          echo "- Settlement notification verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Settlement date calendar verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Step screenshots" >> "$GITHUB_STEP_SUMMARY"

          echo "- Recorded Playwright scenario video" >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final Fixed Price Settlement Exchange Test Status

    if: always()

    needs:
      - run-fixed-price-settlement-exchange
      - deploy-allure

    runs-on: ubuntu-latest

    steps:
      - name: Workflow Summary
        run: |
          echo "Fixed Price Settlement Exchange automation workflow completed."