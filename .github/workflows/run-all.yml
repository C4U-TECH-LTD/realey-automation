name: Run All - Flow 1 + Flow 2 + Flow 3 + Flow 4 + Flow 5 

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-run-all-parallel
  cancel-in-progress: false

jobs:

  # =========================================================
  # RUN ALL 5 FLOWS IN PARALLEL
  # =========================================================

  run-flow:
    name: ${{ matrix.name }}

    runs-on: ubuntu-latest

    timeout-minutes: 90

    strategy:
      fail-fast: false

      matrix:
        include:
          - key: flow1
            name: Flow 1 - Fixed Price
            tags: "@fixed-price"

          - key: flow2
            name: Flow 2 - Offer Price
            tags: "@offer-price"

          - key: flow3
            name: Flow 3 - Auction Bidding & Settlement
            tags: "@auction and @bidding"

          - key: flow4
            name: Flow 4 - Reserve Not Met + Counter Accepted + Settlement
            tags: "@reserve-not-met and @counter-offer and @settlement"

          - key: flow5
            name: Flow 5 - Counter Rejected + Re-list Fixed Price
            tags: "@counter-reject and @relist-fixed"

    env:
      # ===============================================
      # GITHUB MODE
      # ===============================================

      CI: "true"
      HEADLESS: "true"
      SLOW_MO: "0"

      # ===============================================
      # APPLICATION
      # ===============================================

      BASE_URL: ${{ secrets.BASE_URL }}

      # ===============================================
      # AGENT
      # ===============================================

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      # ===============================================
      # GENERAL USER
      # Flow 1 / Flow 2 / Flow 4 / Flow 5
      # and Auction Buyer 1 for Flow 3
      # ===============================================

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      # ===============================================
      # AUCTION BUYER 2
      # Flow 3
      # ===============================================

      AUCTION_BUYER_2_EMAIL: ${{ secrets.AUCTION_BUYER_2_EMAIL }}
      AUCTION_BUYER_2_PASSWORD: ${{ secrets.AUCTION_BUYER_2_PASSWORD }}
      AUCTION_BUYER_2_OTP: ${{ secrets.AUCTION_BUYER_2_OTP }}

      # ===============================================
      # PAYMENT
      # ===============================================

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # =====================================================
      # INSTALL GOOGLE CHROME
      # hooks.js uses channel: "chrome"
      # =====================================================

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify environment
        run: |
          node --version
          npm --version
          npx playwright --version
          npx cucumber-js --version
          npx allure --version
          google-chrome --version

      # =====================================================
      # CLEAN THIS FLOW'S OUTPUT
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results
          rm -rf reports/cucumber
          rm -rf screenshots/cucumber
          rm -rf videos
          mkdir -p flow-status

      # =====================================================
      # RUN THIS MATRIX FLOW
      # =====================================================

      - name: Run ${{ matrix.name }}
        id: cucumber-tests
        continue-on-error: true
        shell: bash
        run: |
          echo "============================================================"
          echo "STARTING ${{ matrix.name }}"
          echo "Tags: ${{ matrix.tags }}"
          echo "============================================================"

          npx cucumber-js --tags "${{ matrix.tags }}"

      # =====================================================
      # SAVE RESULT FOR FINAL COMBINED SUMMARY
      # =====================================================

      - name: Save Flow Result
        if: always()
        shell: bash
        run: |
          echo "${{ steps.cucumber-tests.outcome }}" > "flow-status/${{ matrix.key }}.txt"

      # =====================================================
      # UPLOAD RAW ALLURE RESULTS
      # Each parallel job gets a UNIQUE artifact name.
      # =====================================================

      - name: Upload ${{ matrix.name }} Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.key }}
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD CUCUMBER REPORT
      # =====================================================

      - name: Upload ${{ matrix.name }} Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.key }}
          path: reports/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD SCREENSHOTS
      # =====================================================

      - name: Upload ${{ matrix.name }} Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-screenshots-${{ matrix.key }}
          path: screenshots/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD VIDEOS
      # =====================================================

      - name: Upload ${{ matrix.name }} Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-videos-${{ matrix.key }}
          path: videos/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD STATUS
      # =====================================================

      - name: Upload ${{ matrix.name }} Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-status-${{ matrix.key }}
          path: flow-status/${{ matrix.key }}.txt
          retention-days: 30
          if-no-files-found: error

      # =====================================================
      # FAIL ONLY THIS FLOW AFTER ARTIFACTS ARE UPLOADED
      # Other flows keep running because fail-fast is false.
      # =====================================================

      - name: Fail ${{ matrix.name }} If Test Failed
        if: steps.cucumber-tests.outcome == 'failure'
        run: |
          echo "${{ matrix.name }} failed."
          exit 1


  # =========================================================
  # COMBINE ALLURE RESULTS AFTER ALL 5 PARALLEL JOBS FINISH
  # =========================================================

  build-combined-allure:
    name: Build Combined Allure Report

    if: always()

    needs:
      - run-flow

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # Needed for npx allure
      # =====================================================

      - name: Install dependencies
        run: npm ci

      # =====================================================
      # DOWNLOAD ALL 5 RAW ALLURE ARTIFACTS
      # =====================================================

      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: downloaded-allure-results

      # =====================================================
      # MERGE RAW ALLURE FILES INTO ONE DIRECTORY
      # =====================================================

      - name: Merge Allure Results
        shell: bash
        run: |
          rm -rf allure-results
          mkdir -p allure-results

          echo "Downloaded Allure directories:"
          find downloaded-allure-results -maxdepth 2 -type d -print || true

          while IFS= read -r -d '' file; do
            cp "$file" "allure-results/"
          done < <(find downloaded-allure-results -type f -print0)

          echo "Combined Allure files:"
          find allure-results -maxdepth 1 -type f | wc -l

      # =====================================================
      # GENERATE ONE COMBINED ALLURE HTML REPORT
      # =====================================================

      - name: Generate Combined Allure Report
        if: always()
        run: |
          rm -rf allure-report

          if [ -d "allure-results" ] && \
             [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating combined Allure report for Flow 1-5..."

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results were found."

            mkdir -p allure-report

            echo "<h1>No Allure results generated</h1>" \
              > allure-report/index.html
          fi

      # =====================================================
      # DOWNLOAD FLOW STATUS FILES
      # =====================================================

      - name: Download All Flow Status Files
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: flow-status-*
          path: downloaded-flow-status

      # =====================================================
      # PREPARE COMBINED STATUS
      # =====================================================

      - name: Build Combined Test Summary
        if: always()
        id: combined-status
        shell: bash
        run: |
          get_status() {
            local key="$1"
            local file

            file="$(find downloaded-flow-status -type f -name "${key}.txt" | head -n 1)"

            if [ -n "$file" ] && [ -f "$file" ]; then
              cat "$file"
            else
              echo "unknown"
            fi
          }

          FLOW1="$(get_status flow1)"
          FLOW2="$(get_status flow2)"
          FLOW3="$(get_status flow3)"
          FLOW4="$(get_status flow4)"
          FLOW5="$(get_status flow5)"

          echo "flow1=$FLOW1" >> "$GITHUB_OUTPUT"
          echo "flow2=$FLOW2" >> "$GITHUB_OUTPUT"
          echo "flow3=$FLOW3" >> "$GITHUB_OUTPUT"
          echo "flow4=$FLOW4" >> "$GITHUB_OUTPUT"
          echo "flow5=$FLOW5" >> "$GITHUB_OUTPUT"

          echo "## Realey Parallel Automation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 1 - Fixed Price | $FLOW1 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 2 - Offer Price | $FLOW2 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 3 - Auction Bidding & Settlement | $FLOW3 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 4 - Reserve Not Met + Counter Accepted + Settlement | $FLOW4 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 5 - Counter Rejected + Re-list Fixed Price | $FLOW5 |" >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "============================================================"
          echo "PARALLEL FLOW RESULTS"
          echo "============================================================"
          echo "Flow 1: $FLOW1"
          echo "Flow 2: $FLOW2"
          echo "Flow 3: $FLOW3"
          echo "Flow 4: $FLOW4"
          echo "Flow 5: $FLOW5"
          echo "============================================================"

      # =====================================================
      # UPLOAD COMBINED RAW RESULTS
      # =====================================================

      - name: Upload Combined Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-parallel-allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD COMBINED ALLURE HTML
      # =====================================================

      - name: Upload Combined Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-all-parallel-allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # PREPARE GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Combined Allure Report To GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/


  # =========================================================
  # DEPLOY COMBINED ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Combined Allure Report

    if: always()

    needs:
      - run-flow
      - build-combined-allure

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy Combined Allure Report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Combined Allure Report URL
        run: |
          echo ""
          echo "============================================================"
          echo "COMBINED FLOW 1-5 ALLURE REPORT"
          echo "============================================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================================"

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Run All Parallel Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Combined Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Report includes:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow 1 - Fixed Price" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow 2 - Offer Price" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow 3 - Auction Bidding & Settlement" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow 4 - Reserve Not Met + Counter Accepted + Settlement" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow 5 - Counter Rejected + Re-list as Fixed Price" >> "$GITHUB_STEP_SUMMARY"
          echo "- Step screenshots available as separate artifacts per flow" >> "$GITHUB_STEP_SUMMARY"
          echo "- Videos available as separate artifacts per flow" >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final All Tests Status

    if: always()

    needs:
      - run-flow
      - build-combined-allure
      - deploy-allure

    runs-on: ubuntu-latest

    steps:

      - name: Workflow Summary
        shell: bash
        run: |
          echo "============================================================"
          echo "REALEY PARALLEL RUN ALL COMPLETED"
          echo "============================================================"
          echo "Flow 1: Fixed Price"
          echo "Flow 2: Offer Price"
          echo "Flow 3: Auction Bidding & Settlement"
          echo "Flow 4: Reserve Not Met + Counter Accepted + Settlement"
          echo "Flow 5: Counter Rejected + Re-list as Fixed Price"
          echo "============================================================"

          if [ "${{ needs.run-flow.result }}" != "success" ]; then
            echo "One or more parallel flows failed."
            exit 1
          fi

          if [ "${{ needs.build-combined-allure.result }}" != "success" ]; then
            echo "Combined Allure report build failed."
            exit 1
          fi

          if [ "${{ needs.deploy-allure.result }}" != "success" ]; then
            echo "Allure deployment failed."
            exit 1
          fi

          echo "All 5 flows passed and the combined report was published."