name: Run All - Flow 1 + Flow 2 +  Flow 3 + Flow 4 + Flow 5

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-run-all
  cancel-in-progress: false

jobs:

  # =========================================================
  # RUN ALL TESTS
  # =========================================================

  run-all:
    name: Run Fixed Price + Offer Price + Auction Flow 3 + Flow 4 + Flow 5

    runs-on: ubuntu-latest

    # Flow 3, Flow 4 and Flow 5 each include an Auction wait.
    # Give the complete 5-flow run enough time.
    timeout-minutes: 180

    env:
      # ===============================================
      # GITHUB MODE
      # ===============================================

      CI: "true"
      HEADLESS: "true"
      SLOW_MO: "0"

      # ===============================================
      # APPLICATION
      # ===============================================

      BASE_URL: ${{ secrets.BASE_URL }}

      # ===============================================
      # AGENT
      # ===============================================

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      # ===============================================
      # GENERAL USER
      # Flow 1 / Flow 2 / Auction Buyer 1
      # ===============================================

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      # ===============================================
      # AUCTION BUYER 2
      # Flow 3
      # ===============================================

      AUCTION_BUYER_2_EMAIL: ${{ secrets.AUCTION_BUYER_2_EMAIL }}
      AUCTION_BUYER_2_PASSWORD: ${{ secrets.AUCTION_BUYER_2_PASSWORD }}
      AUCTION_BUYER_2_OTP: ${{ secrets.AUCTION_BUYER_2_OTP }}

      # ===============================================
      # PAYMENT
      # ===============================================

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Browser
        run: |
          npx playwright install --with-deps chromium

      # =====================================================
      # INSTALL GOOGLE CHROME
      # hooks.js uses channel: "chrome"
      # =====================================================

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get update

          sudo apt-get install -y \
            ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify environment
        run: |
          node --version
          npm --version
          npx playwright --version
          npx cucumber-js --version
          npx allure --version
          google-chrome --version

      # =====================================================
      # CLEAN OLD OUTPUT
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf reports/cucumber
          rm -rf screenshots/cucumber
          rm -rf videos

      # =====================================================
      # FLOW 1 - FIXED PRICE
      # =====================================================

      - name: Run Flow 1 - Fixed Price
        id: fixed-price-tests
        continue-on-error: true

        run: |
          echo "============================================"
          echo "STARTING FLOW 1 - FIXED PRICE"
          echo "============================================"

          npx cucumber-js --tags "@fixed-price"

      # =====================================================
      # FLOW 2 - OFFER PRICE
      # =====================================================

      - name: Run Flow 2 - Offer Price
        id: offer-price-tests
        continue-on-error: true

        run: |
          echo "============================================"
          echo "STARTING FLOW 2 - OFFER PRICE"
          echo "============================================"

          npx cucumber-js --tags "@offer-price"

      # =====================================================
      # FLOW 3 - AUCTION BIDDING & SETTLEMENT
      # =====================================================

      - name: Run Flow 3 - Auction Bidding & Settlement
        id: auction-flow3-tests
        continue-on-error: true

        run: |
          echo "============================================"
          echo "STARTING FLOW 3 - AUCTION BIDDING & SETTLEMENT"
          echo "============================================"

          npx cucumber-js --tags "@auction and @bidding"

      # =====================================================
      # FLOW 4 - RESERVE NOT MET + COUNTER ACCEPTED + SETTLEMENT
      # =====================================================

      - name: Run Flow 4 - Reserve Not Met Counter Accepted Settlement
        id: auction-flow4-tests
        continue-on-error: true

        run: |
          echo "============================================"
          echo "STARTING FLOW 4 - RESERVE NOT MET"
          echo "COUNTER ACCEPTED + SETTLEMENT"
          echo "============================================"

          npx cucumber-js --tags "@reserve-not-met and @counter-offer and @settlement"

      # =====================================================
      # FLOW 5 - COUNTER REJECTED + RE-LIST FIXED PRICE
      # =====================================================

      - name: Run Flow 5 - Counter Rejected Re-list Fixed Price
        id: auction-flow5-tests
        continue-on-error: true

        run: |
          echo "============================================"
          echo "STARTING FLOW 5 - COUNTER REJECTED"
          echo "RE-LIST AS FIXED PRICE"
          echo "============================================"

          npx cucumber-js --tags "@counter-reject and @relist-fixed"

      # =====================================================
      # GENERATE COMBINED ALLURE REPORT
      # =====================================================

      - name: Generate Combined Allure Report
        if: always()

        run: |
          if [ -d "allure-results" ] && \
             [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating combined Allure report..."

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results generated."

            mkdir -p allure-report

            echo "<h1>No Allure results generated</h1>" \
              > allure-report/index.html

          fi

      # =====================================================
      # CUCUMBER REPORT
      # =====================================================

      - name: Upload Cucumber Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: run-all-cucumber-report
          path: reports/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # ALLURE RAW RESULTS
      # =====================================================

      - name: Upload Allure Raw Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: run-all-allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # ALLURE HTML REPORT
      # =====================================================

      - name: Upload Allure HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: run-all-allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: run-all-cucumber-screenshots
          path: screenshots/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # RECORDED VIDEOS
      # =====================================================

      - name: Upload Test Videos
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: run-all-cucumber-videos
          path: videos/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()

        uses: actions/configure-pages@v5

      - name: Upload Allure Report To GitHub Pages
        if: always()

        uses: actions/upload-pages-artifact@v4

        with:
          path: allure-report/

      # =====================================================
      # DISPLAY ALL 5 RESULTS
      # =====================================================

      - name: Display All Test Results
        if: always()

        run: |
          echo ""
          echo "============================================================"
          echo "REALEY ALL AUTOMATION RESULTS"
          echo "============================================================"
          echo "Flow 1 - Fixed Price:                      ${{ steps.fixed-price-tests.outcome }}"
          echo "Flow 2 - Offer Price:                      ${{ steps.offer-price-tests.outcome }}"
          echo "Flow 3 - Auction Bidding & Settlement:     ${{ steps.auction-flow3-tests.outcome }}"
          echo "Flow 4 - Reserve Not Met + Accepted:       ${{ steps.auction-flow4-tests.outcome }}"
          echo "Flow 5 - Counter Rejected + Re-list Fixed: ${{ steps.auction-flow5-tests.outcome }}"
          echo "============================================================"

      # =====================================================
      # GITHUB JOB SUMMARY
      # =====================================================

      - name: Add Test Results To Summary
        if: always()

        run: |
          echo "## Realey Automation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Flow | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 1 - Fixed Price | ${{ steps.fixed-price-tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 2 - Offer Price | ${{ steps.offer-price-tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 3 - Auction Bidding & Settlement | ${{ steps.auction-flow3-tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 4 - Reserve Not Met + Counter Accepted + Settlement | ${{ steps.auction-flow4-tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flow 5 - Counter Rejected + Re-list Fixed Price | ${{ steps.auction-flow5-tests.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

      # =====================================================
      # FAIL JOB IF ANY FLOW FAILED
      # =====================================================

      - name: Fail Job If Any Test Failed
        if: |
          steps.fixed-price-tests.outcome == 'failure' ||
          steps.offer-price-tests.outcome == 'failure' ||
          steps.auction-flow3-tests.outcome == 'failure' ||
          steps.auction-flow4-tests.outcome == 'failure' ||
          steps.auction-flow5-tests.outcome == 'failure'

        run: |
          echo "============================================================"
          echo "ONE OR MORE AUTOMATION FLOWS FAILED"
          echo "============================================================"
          echo "Flow 1 - Fixed Price:                      ${{ steps.fixed-price-tests.outcome }}"
          echo "Flow 2 - Offer Price:                      ${{ steps.offer-price-tests.outcome }}"
          echo "Flow 3 - Auction Bidding & Settlement:     ${{ steps.auction-flow3-tests.outcome }}"
          echo "Flow 4 - Reserve Not Met + Accepted:       ${{ steps.auction-flow4-tests.outcome }}"
          echo "Flow 5 - Counter Rejected + Re-list Fixed: ${{ steps.auction-flow5-tests.outcome }}"
          exit 1


  # =========================================================
  # DEPLOY COMBINED ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Allure Report

    if: always()

    needs:
      - run-all

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show Allure Report URL
        run: |
          echo ""
          echo "============================================"
          echo "COMBINED ALLURE REPORT"
          echo "============================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================"

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Run All Allure Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Report includes:" >> "$GITHUB_STEP_SUMMARY"

          echo "- Flow 1 - Fixed Price" >> "$GITHUB_STEP_SUMMARY"

          echo "- Flow 2 - Offer Price" >> "$GITHUB_STEP_SUMMARY"

          echo "- Flow 3 - Auction Bidding & Settlement" >> "$GITHUB_STEP_SUMMARY"

          echo "- Flow 4 - Reserve Not Met + Counter Accepted + Settlement" >> "$GITHUB_STEP_SUMMARY"

          echo "- Flow 5 - Counter Rejected + Re-list as Fixed Price" >> "$GITHUB_STEP_SUMMARY"

          echo "- Step screenshots" >> "$GITHUB_STEP_SUMMARY"

          echo "- Recorded Playwright scenario videos" >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final All Tests Status

    if: always()

    needs:
      - run-all
      - deploy-allure

    runs-on: ubuntu-latest

    steps:

      - name: Workflow Summary
        run: |
          echo "============================================"
          echo "REALEY RUN ALL COMPLETED"
          echo "============================================"
          echo "Flow 1: Fixed Price"
          echo "Flow 2: Offer Price"
          echo "Flow 3: Auction Bidding & Settlement"
          echo "Flow 4: Reserve Not Met + Counter Accepted + Settlement"
          echo "Flow 5: Counter Rejected + Re-list as Fixed Price"
          echo "============================================"