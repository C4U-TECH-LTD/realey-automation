name: All Run - Fixed Price + Offer Price

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realey-all-run
  cancel-in-progress: false

jobs:
  run-all-flows:
    name: Run Flow 1 + Flow 2
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      CI: "true"
      HEADLESS: "true"
      SLOW_MO: "0"

      BASE_URL: ${{ secrets.BASE_URL }}

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      # =====================================================
      # SETUP
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # CLEAN ONLY ONCE
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf reports/cucumber
          rm -rf screenshots/cucumber
          rm -rf videos

          mkdir -p allure-results

      # =====================================================
      # FLOW 1
      # =====================================================

      - name: Run Flow 1 - Fixed Price
        id: flow1
        continue-on-error: true
        run: |
          npx cucumber-js --tags "@fixed-price"

      # =====================================================
      # FLOW 2
      # Runs after Flow 1
      # =====================================================

      - name: Run Flow 2 - Offer Price
        id: flow2
        if: always()
        continue-on-error: true
        run: |
          npx cucumber-js --tags "@offer-price"

      # =====================================================
      # ONE ALLURE REPORT WITH BOTH RESULTS
      # =====================================================

      - name: Generate Combined Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating combined Allure report..."

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results generated."

            mkdir -p allure-report

            echo "<h1>No Allure results generated</h1>" \
              > allure-report/index.html

          fi

      # =====================================================
      # UPLOAD COMBINED ALLURE REPORT
      # =====================================================

      - name: Upload Combined Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-flows-allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-flows-allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-flows-screenshots
          path: screenshots/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # VIDEOS
      # =====================================================

      - name: Upload Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-flows-videos
          path: videos/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Combined Allure To GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      # =====================================================
      # RESULT SUMMARY
      # =====================================================

      - name: Show Test Results
        if: always()
        run: |
          echo "============================================"
          echo "REALEY ALL E2E FLOWS"
          echo "============================================"
          echo "Flow 1 - Fixed Price: ${{ steps.flow1.outcome }}"
          echo "Flow 2 - Offer Price: ${{ steps.flow2.outcome }}"
          echo "============================================"

      - name: Fail If Any Flow Failed
        if: |
          steps.flow1.outcome == 'failure' ||
          steps.flow2.outcome == 'failure'
        run: |
          echo "One or more E2E flows failed."
          exit 1

  # =========================================================
  # PUBLISH COMBINED ALLURE
  # =========================================================

  deploy-allure:
    name: Publish Combined Allure Report
    if: always()
    needs:
      - run-all-flows

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Report Link
        run: |
          echo "## 📊 Realey Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open Combined Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Included E2E Flows" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow 1 - Fixed Price Direct Offer" >> "$GITHUB_STEP_SUMMARY"
          echo "- Flow 2 - Offer Price Counter Offer" >> "$GITHUB_STEP_SUMMARY"