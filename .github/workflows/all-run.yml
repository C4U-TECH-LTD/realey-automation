name: All Run
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: realey-all-run
  cancel-in-progress: false

jobs:
  # =========================================================
  # RUN BOTH FLOWS
  # =========================================================

  run-all-flows:
    name: Run Flow 1 + Flow 2

    runs-on: ubuntu-latest

    timeout-minutes: 90

    env:
      # ===============================================
      # CI / PLAYWRIGHT
      # ===============================================

      CI: "true"
      HEADLESS: "true"
      SLOW_MO: "0"

      # ===============================================
      # APPLICATION
      # ===============================================

      BASE_URL: ${{ secrets.BASE_URL }}

      # ===============================================
      # AGENT
      # ===============================================

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      # ===============================================
      # GENERAL USER
      # ===============================================

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      # ===============================================
      # PAYMENT
      # ===============================================

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright
        run: |
          npx playwright install --with-deps chromium

      # =====================================================
      # INSTALL GOOGLE CHROME
      # =====================================================

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get update

          sudo apt-get install -y \
            ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify environment
        run: |
          echo "============================================"
          echo "ENVIRONMENT"
          echo "============================================"

          node --version
          npm --version
          npx playwright --version
          npx cucumber-js --version
          npx allure --version
          google-chrome --version

      # =====================================================
      # CLEAN OLD REPORTS
      # Clean ONLY ONCE so both flow results stay together
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results
          rm -rf allure-report
          rm -rf reports/cucumber
          rm -rf screenshots/cucumber
          rm -rf videos

          mkdir -p allure-results

      # =====================================================
      # FLOW 1 - FIXED PRICE
      # =====================================================

      - name: Run Flow 1 - Fixed Price
        id: flow1

        continue-on-error: true

        run: |
          echo "============================================"
          echo "FLOW 1 - FIXED PRICE"
          echo "============================================"

          npx cucumber-js --tags "@fixed-price"

      # =====================================================
      # FLOW 2 - OFFER PRICE
      # Runs after Flow 1 even if Flow 1 fails
      # =====================================================

      - name: Run Flow 2 - Offer Price
        id: flow2

        if: always()

        continue-on-error: true

        run: |
          echo "============================================"
          echo "FLOW 2 - OFFER PRICE"
          echo "============================================"

          npx cucumber-js --tags "@offer-price"

      # =====================================================
      # GENERATE ONE COMBINED ALLURE REPORT
      # =====================================================

      - name: Generate Combined Allure Report
        if: always()

        run: |
          if [ -d "allure-results" ] && \
             [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "============================================"
            echo "GENERATING COMBINED ALLURE REPORT"
            echo "============================================"

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results were generated."

            mkdir -p allure-report

            echo "<html><body><h1>No Allure results generated</h1></body></html>" \
              > allure-report/index.html

          fi

      # =====================================================
      # UPLOAD COMBINED ALLURE HTML
      # =====================================================

      - name: Upload Combined Allure Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: all-flows-allure-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD RAW ALLURE RESULTS
      # =====================================================

      - name: Upload Allure Raw Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: all-flows-allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: all-flows-screenshots
          path: screenshots/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # UPLOAD VIDEOS
      # =====================================================

      - name: Upload Videos
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: all-flows-videos
          path: videos/cucumber/
          retention-days: 30
          if-no-files-found: warn

      # =====================================================
      # PREPARE GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()

        uses: actions/configure-pages@v5

      # =====================================================
      # UPLOAD ALLURE SITE FOR PAGES
      # =====================================================

      - name: Upload Combined Allure To GitHub Pages
        if: always()

        uses: actions/upload-pages-artifact@v4

        with:
          path: allure-report/

      # =====================================================
      # TEST RESULT SUMMARY
      # =====================================================

      - name: Show Test Results
        if: always()

        run: |
          echo ""
          echo "============================================"
          echo "REALEY ALL E2E FLOWS"
          echo "============================================"
          echo "Flow 1 - Fixed Price : ${{ steps.flow1.outcome }}"
          echo "Flow 2 - Offer Price : ${{ steps.flow2.outcome }}"
          echo "============================================"

      # =====================================================
      # JOB SUMMARY
      # =====================================================

      - name: Add Flow Results To Summary
        if: always()

        run: |
          echo "## 🧪 Realey E2E Test Results" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Flow | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"

          echo "| Flow 1 - Fixed Price Direct Offer | ${{ steps.flow1.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "| Flow 2 - Offer Price Counter Offer | ${{ steps.flow2.outcome }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Combined Allure report is generated from both flows." >> "$GITHUB_STEP_SUMMARY"

      # =====================================================
      # FAIL JOB IF ANY FLOW FAILED
      # =====================================================

      - name: Fail Job If Any Flow Failed
        if: |
          steps.flow1.outcome == 'failure' ||
          steps.flow2.outcome == 'failure'

        run: |
          echo "One or more E2E flows failed."
          exit 1


  # =========================================================
  # PUBLISH COMBINED ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Combined Allure Report

    if: always()

    needs:
      - run-all-flows

    runs-on: ubuntu-latest

    timeout-minutes: 15

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # =====================================================
      # DEPLOY
      # =====================================================

      - name: Deploy Combined Allure Report
        id: deployment

        uses: actions/deploy-pages@v4

      # =====================================================
      # DISPLAY URL
      # =====================================================

      - name: Show Allure Report URL
        run: |
          echo ""
          echo "============================================"
          echo "REALEY COMBINED ALLURE REPORT"
          echo "============================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================"

      # =====================================================
      # SAME STYLE AS YOUR FLOW 2 SUMMARY
      # =====================================================

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Combined Allure Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Report includes:" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- Fixed Price Direct Offer scenario results" >> "$GITHUB_STEP_SUMMARY"

          echo "- Offer Price Counter Offer scenario results" >> "$GITHUB_STEP_SUMMARY"

          echo "- Counter offer negotiation steps" >> "$GITHUB_STEP_SUMMARY"

          echo "- Settlement and deposit payment steps" >> "$GITHUB_STEP_SUMMARY"

          echo "- Step screenshots" >> "$GITHUB_STEP_SUMMARY"

          echo "- Recorded Playwright scenario videos" >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final All Run Test Status

    if: always()

    needs:
      - run-all-flows
      - deploy-allure

    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # CONSOLE SUMMARY
      # =====================================================

      - name: Workflow Summary
        run: |
          echo ""
          echo "============================================"
          echo "REALEY ALL E2E AUTOMATION"
          echo "============================================"
          echo "Tests: ${{ needs.run-all-flows.result }}"
          echo "Allure Report: ${{ needs.deploy-allure.result }}"
          echo "============================================"

      # =====================================================
      # FINAL GITHUB SUMMARY
      # =====================================================

      - name: Add Final Summary
        run: |
          echo "## ✅ Realey All E2E Automation Completed" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Included Flows" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- Flow 1 - Fixed Price Direct Offer Acceptance and Settlement" >> "$GITHUB_STEP_SUMMARY"

          echo "- Flow 2 - Offer Price Counter Offer Negotiation and Settlement" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "📊 Combined Allure report publication status: **${{ needs.deploy-allure.result }}**" >> "$GITHUB_STEP_SUMMARY"

      # =====================================================
      # FINAL FAILURE
      # =====================================================

      - name: Fail Final Status If Tests Failed
        if: needs.run-all-flows.result == 'failure'

        run: |
          echo "One or more test flows failed."
          exit 1

      - name: Fail Final Status If Allure Publish Failed
        if: needs.deploy-allure.result == 'failure'

        run: |
          echo "Combined Allure report publishing failed."
          exit 1