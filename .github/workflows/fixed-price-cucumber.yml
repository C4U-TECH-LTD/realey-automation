name: Realey Fixed Price Cucumber Automation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-fixed-price
  cancel-in-progress: false

jobs:
  # =========================================================
  # RUN FIXED PRICE TEST
  # =========================================================

  run-fixed-price:
    name: Run Fixed Price Test

    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 45

    env:
      # Visible browser
      HEADLESS: "false"

      # Slow down actions so the test is easy to watch
      SLOW_MO: "500"

      BASE_URL: ${{ secrets.BASE_URL }}

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL
      # =====================================================

      - name: Install dependencies
        shell: powershell
        run: |
          npm ci

      # =====================================================
      # VERIFY
      # =====================================================

      - name: Verify environment
        shell: powershell
        run: |
          node --version
          npm --version
          npx playwright --version
          npx cucumber-js --version
          npx allure --version
          google-chrome --version

      # =====================================================
      # CLEAN OLD OUTPUT
      # =====================================================

      - name: Clean previous reports
        shell: powershell
        run: |
          Remove-Item allure-results `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item allure-report `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item reports\cucumber `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item screenshots\cucumber `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item videos `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

      # =====================================================
      # RUN ONLY FIXED PRICE
      # =====================================================

      - name: Run Fixed Price Cucumber Test
        id: cucumber-tests

        continue-on-error: true

        shell: powershell

        run: |
          npx cucumber-js --tags "@fixed-price"

      # =====================================================
      # GENERATE ALLURE
      # =====================================================

      - name: Generate Allure Report
        if: always()

        shell: powershell

        run: |
          if (Test-Path "allure-results") {

            $files =
              Get-ChildItem `
                "allure-results" `
                -ErrorAction SilentlyContinue

            if ($files.Count -gt 0) {

              Write-Host ""
              Write-Host "Generating Allure report..."

              npx allure generate `
                allure-results `
                --clean `
                -o allure-report

            }
            else {

              Write-Host "allure-results is empty"

              New-Item `
                -ItemType Directory `
                -Force `
                -Path "allure-report" |
                Out-Null

              "<h1>No Allure results generated</h1>" |
                Out-File `
                  "allure-report\index.html"
            }

          }
          else {

            Write-Host "allure-results folder not found"

            New-Item `
              -ItemType Directory `
              -Force `
              -Path "allure-report" |
              Out-Null

            "<h1>No Allure results generated</h1>" |
              Out-File `
                "allure-report\index.html"
          }

      # =====================================================
      # NORMAL ARTIFACTS
      # =====================================================

      - name: Upload Cucumber Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: cucumber-report

          path: reports/cucumber/

          retention-days: 30

          if-no-files-found: warn

      - name: Upload Allure Raw Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: allure-results

          path: allure-results/

          retention-days: 30

          if-no-files-found: warn

      - name: Upload Allure HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: allure-html-report

          path: allure-report/

          retention-days: 30

          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: cucumber-screenshots

          path: screenshots/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # VIDEO BACKUP ARTIFACT
      # =====================================================

      - name: Upload Test Videos
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: cucumber-videos

          path: videos/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()

        uses: actions/configure-pages@v5

      - name: Upload Allure Report To GitHub Pages
        if: always()

        uses: actions/upload-pages-artifact@v4

        with:
          path: allure-report/

      # =====================================================
      # DISPLAY RESULT
      # =====================================================

      - name: Display Fixed Price Test Result
        if: always()

        shell: powershell

        run: |
          Write-Host ""
          Write-Host "============================================"
          Write-Host "REALEY FIXED PRICE AUTOMATION"
          Write-Host "============================================"
          Write-Host "Result: ${{ steps.cucumber-tests.outcome }}"
          Write-Host "============================================"

      # =====================================================
      # FAIL JOB IF CUCUMBER FAILED
      # =====================================================

      - name: Fail Job If Fixed Price Test Failed
        if: steps.cucumber-tests.outcome == 'failure'

        shell: powershell

        run: |
          Write-Host "Fixed Price Cucumber test failed."

          exit 1

  # =========================================================
  # DEPLOY ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Allure Report

    if: always()

    needs:
      - run-fixed-price

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report
        id: deployment

        uses: actions/deploy-pages@v4

      - name: Show Allure Report URL
        run: |
          echo ""
          echo "============================================"
          echo "ALLURE REPORT"
          echo "============================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================"

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Fixed Price Allure Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "The report includes Cucumber steps, screenshots, and recorded scenario video." >> "$GITHUB_STEP_SUMMARY"

  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final Test Status

    if: always()

    needs:
      - run-fixed-price
      - deploy-allure

    runs-on: ubuntu-latest

    steps:
      - name: Workflow Summary
        run: |
          echo "Fixed Price automation workflow completed."