name: Realey Fixed Price Cucumber Automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realey-fixed-price
  cancel-in-progress: false

jobs:
  run-fixed-price:
    name: Run Fixed Price Test
    runs-on:
      - self-hosted
      - Windows

    timeout-minutes: 45

    env:
      HEADLESS: "false"
      SLOW_MO: "500"

      BASE_URL: ${{ secrets.BASE_URL }}

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Verify environment
        shell: powershell
        run: |
          node --version
          npm --version
          npx playwright --version
          npx cucumber-js --version

      - name: Clean previous reports
        shell: powershell
        run: |
          Remove-Item allure-results -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item allure-report -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item reports\cucumber -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item screenshots\cucumber -Recurse -Force -ErrorAction SilentlyContinue

      - name: Run Fixed Price Cucumber Test
        id: cucumber-tests
        continue-on-error: true
        shell: powershell
        run: |
          npx cucumber-js --tags "@fixed-price"

      - name: Generate Allure Report
        if: always()
        shell: powershell
        run: |
          if (Test-Path "allure-results") {
            $files = Get-ChildItem "allure-results" -ErrorAction SilentlyContinue

            if ($files.Count -gt 0) {
              npx allure generate allure-results --clean -o allure-report
            }
            else {
              Write-Host "allure-results folder is empty"
              New-Item -ItemType Directory -Force -Path "allure-report" | Out-Null
              "<h1>No Allure results generated</h1>" |
                Out-File "allure-report\index.html"
            }
          }
          else {
            Write-Host "allure-results folder not found"
            New-Item -ItemType Directory -Force -Path "allure-report" | Out-Null
            "<h1>No Allure results generated</h1>" |
              Out-File "allure-report\index.html"
          }

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/cucumber/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-screenshots
          path: screenshots/cucumber/
          retention-days: 30
          if-no-files-found: warn

      - name: Display Test Result
        if: always()
        shell: powershell
        run: |
          Write-Host "Fixed Price test result: ${{ steps.cucumber-tests.outcome }}"

      - name: Fail Workflow If Test Failed
        if: steps.cucumber-tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Host "Fixed Price test failed."
          exit 1