name: Flow 7 - Fixed Price Sales Instructions

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-fixed-price-sales-instructions
  cancel-in-progress: false

jobs:
  # =========================================================
  # RUN FLOW 7
  # =========================================================

  run-fixed-price-sales-instructions:
    name: Run Fixed Price Sales Instructions Test

    runs-on: ubuntu-latest

    timeout-minutes: 45

    env:
      # ===============================================
      # GITHUB MODE
      # ===============================================

      CI: "true"

      HEADLESS: "true"

      SLOW_MO: "0"

      # ===============================================
      # APPLICATION
      # ===============================================

      BASE_URL: ${{ secrets.BASE_URL }}

      # ===============================================
      # AGENT
      # ===============================================

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      # ===============================================
      # GENERAL USER / BUYER
      # ===============================================

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      # ===============================================
      # PAYMENT
      # ===============================================

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Browser
        run: |
          npx playwright install --with-deps chromium

      # =====================================================
      # INSTALL GOOGLE CHROME
      # hooks.js uses channel: "chrome"
      # =====================================================

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get update

          sudo apt-get install -y \
            ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify environment
        run: |
          node --version

          npm --version

          npx playwright --version

          npx cucumber-js --version

          npx allure --version

          google-chrome --version

      # =====================================================
      # CLEAN OLD OUTPUT
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results

          rm -rf allure-report

          rm -rf reports/cucumber

          rm -rf screenshots/cucumber

          rm -rf videos

      # =====================================================
      # RUN ONLY FLOW 7
      #
      # Feature tags:
      # @e2e
      # @fixed-price
      # @direct-offer
      # @sales-instructions
      # =====================================================

      - name: Run Fixed Price Sales Instructions Cucumber Test
        id: cucumber-tests

        continue-on-error: true

        run: |
          npx cucumber-js --tags "@flow-7"

      # =====================================================
      # GENERATE ALLURE REPORT
      # =====================================================

      - name: Generate Allure Report
        if: always()

        run: |
          if [ -d "allure-results" ] && \
             [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating Allure report..."

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results generated."

            mkdir -p allure-report

            echo "<h1>No Allure results generated</h1>" \
              > allure-report/index.html

          fi

      # =====================================================
      # CUCUMBER REPORT
      # =====================================================

      - name: Upload Cucumber Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-sales-instructions-cucumber-report

          path: reports/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # ALLURE RAW RESULTS
      # =====================================================

      - name: Upload Allure Raw Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-sales-instructions-allure-results

          path: allure-results/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # ALLURE HTML REPORT
      # =====================================================

      - name: Upload Allure HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-sales-instructions-allure-html-report

          path: allure-report/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-sales-instructions-cucumber-screenshots

          path: screenshots/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # RECORDED VIDEOS
      # =====================================================

      - name: Upload Test Videos
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: fixed-price-sales-instructions-cucumber-videos

          path: videos/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()

        uses: actions/configure-pages@v5

      - name: Upload Allure Report To GitHub Pages
        if: always()

        uses: actions/upload-pages-artifact@v4

        with:
          path: allure-report/

      # =====================================================
      # DISPLAY TEST RESULT
      # =====================================================

      - name: Display Fixed Price Sales Instructions Test Result
        if: always()

        run: |
          echo ""
          echo "======================================================"
          echo "REALEY FIXED PRICE SALES INSTRUCTIONS"
          echo "======================================================"
          echo "Tags: @e2e @fixed-price @direct-offer @sales-instructions"
          echo "Result: ${{ steps.cucumber-tests.outcome }}"
          echo "======================================================"

      # =====================================================
      # FAIL JOB IF CUCUMBER FAILED
      # =====================================================

      - name: Fail Job If Sales Instructions Test Failed
        if: steps.cucumber-tests.outcome == 'failure'

        run: |
          echo "Fixed Price Sales Instructions Cucumber test failed."

          exit 1


  # =========================================================
  # DEPLOY ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Fixed Price Sales Instructions Allure Report

    if: always()

    needs:
      - run-fixed-price-sales-instructions

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report
        id: deployment

        uses: actions/deploy-pages@v4

      - name: Show Allure Report URL
        run: |
          echo ""
          echo "======================================================"
          echo "FIXED PRICE SALES INSTRUCTIONS ALLURE REPORT"
          echo "======================================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "======================================================"

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Fixed Price Sales Instructions Allure Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Report includes:" >> "$GITHUB_STEP_SUMMARY"

          echo "- Fixed Price listing creation and publishing" >> "$GITHUB_STEP_SUMMARY"

          echo "- General User direct offer submission" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent offer acceptance" >> "$GITHUB_STEP_SUMMARY"

          echo "- Sales Instructions unavailable before settlement completion" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer settlement process" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer Solicitor selection" >> "$GITHUB_STEP_SUMMARY"

          echo "- Mortgage Broker selection" >> "$GITHUB_STEP_SUMMARY"

          echo "- Deposit payment" >> "$GITHUB_STEP_SUMMARY"

          echo "- Settlement completion" >> "$GITHUB_STEP_SUMMARY"

          echo "- Sales Instructions availability" >> "$GITHUB_STEP_SUMMARY"

          echo "- Sales Instructions document generation" >> "$GITHUB_STEP_SUMMARY"

          echo "- Firm validation" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agent Licence No validation" >> "$GITHUB_STEP_SUMMARY"

          echo "- Agency Licence No validation" >> "$GITHUB_STEP_SUMMARY"

          echo "- Broker chatroom delivery verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Broker email delivery verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Broker in-app notification verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Seller Solicitor delivery verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer Solicitor delivery verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer exclusion verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Vendor exclusion verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- Exactly one delivery per intended recipient and channel" >> "$GITHUB_STEP_SUMMARY"

          echo "- Second-click idempotency verification" >> "$GITHUB_STEP_SUMMARY"

          echo "- No duplicate Sales Instructions delivery" >> "$GITHUB_STEP_SUMMARY"

          echo "- No error after second Sales Instructions click" >> "$GITHUB_STEP_SUMMARY"

          echo "- Step screenshots" >> "$GITHUB_STEP_SUMMARY"

          echo "- Recorded Playwright scenario video" >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final Fixed Price Sales Instructions Test Status

    if: always()

    needs:
      - run-fixed-price-sales-instructions
      - deploy-allure

    runs-on: ubuntu-latest

    steps:
      - name: Workflow Summary
        run: |
          echo "Fixed Price Sales Instructions automation workflow completed."