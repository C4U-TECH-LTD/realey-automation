name: Flow 3-Auction-Bidding & Settlement Completion

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: realey-auction
  cancel-in-progress: false

jobs:
  # =========================================================
  # RUN AUCTION TEST
  # =========================================================

  run-auction:
    name: Run Auction Test

    runs-on: ubuntu-latest

    # Auction itself can wait around 15 minutes,
    # plus listing, two buyers, registration, bidding,
    # settlement, reports and CI overhead.
    timeout-minutes: 60

    env:
      # ===============================================
      # GITHUB MODE
      # ===============================================

      CI: "true"

      HEADLESS: "true"

      SLOW_MO: "0"

      # ===============================================
      # APPLICATION
      # ===============================================

      BASE_URL: ${{ secrets.BASE_URL }}

      # ===============================================
      # AGENT
      # ===============================================

      AGENT_EMAIL: ${{ secrets.AGENT_EMAIL }}
      AGENT_PASSWORD: ${{ secrets.AGENT_PASSWORD }}
      AGENT_OTP: ${{ secrets.AGENT_OTP }}

      # ===============================================
      # FIRST AUCTION BUYER
      # ===============================================

      GENERAL_USER_EMAIL: ${{ secrets.GENERAL_USER_EMAIL }}
      GENERAL_USER_PASSWORD: ${{ secrets.GENERAL_USER_PASSWORD }}
      GENERAL_USER_OTP: ${{ secrets.GENERAL_USER_OTP }}

      # ===============================================
      # SECOND AUCTION BUYER
      # ===============================================

      AUCTION_BUYER_2_EMAIL: ${{ secrets.AUCTION_BUYER_2_EMAIL }}
      AUCTION_BUYER_2_PASSWORD: ${{ secrets.AUCTION_BUYER_2_PASSWORD }}
      AUCTION_BUYER_2_OTP: ${{ secrets.AUCTION_BUYER_2_OTP }}

      # ===============================================
      # PAYMENT
      # ===============================================

      TEST_CARD_NUMBER: ${{ secrets.TEST_CARD_NUMBER }}
      TEST_CARD_EXPIRY: ${{ secrets.TEST_CARD_EXPIRY }}
      TEST_CARD_CVC: ${{ secrets.TEST_CARD_CVC }}

    steps:
      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # NODE
      # =====================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 24
          cache: npm

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          npm ci

      # =====================================================
      # INSTALL PLAYWRIGHT
      # =====================================================

      - name: Install Playwright Browser
        run: |
          npx playwright install --with-deps chromium

      # =====================================================
      # INSTALL GOOGLE CHROME
      # Because hooks.js uses channel: "chrome"
      # =====================================================

      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get update

          sudo apt-get install -y \
            ./google-chrome-stable_current_amd64.deb

      # =====================================================
      # VERIFY ENVIRONMENT
      # =====================================================

      - name: Verify environment
        run: |
          node --version

          npm --version

          npx playwright --version

          npx cucumber-js --version

          npx allure --version

          google-chrome --version

      # =====================================================
      # CLEAN OLD OUTPUT
      # =====================================================

      - name: Clean previous reports
        run: |
          rm -rf allure-results

          rm -rf allure-report

          rm -rf reports/cucumber

          rm -rf screenshots/cucumber

          rm -rf videos

      # =====================================================
      # RUN ONLY AUCTION FLOW
      # =====================================================

      - name: Run Auction Cucumber Test
        id: cucumber-tests

        continue-on-error: true

        run: |
          npx cucumber-js --tags "@auction"

      # =====================================================
      # GENERATE ALLURE REPORT
      # =====================================================

      - name: Generate Allure Report
        if: always()

        run: |
          if [ -d "allure-results" ] && \
             [ "$(ls -A allure-results 2>/dev/null)" ]; then

            echo "Generating Allure report..."

            npx allure generate \
              allure-results \
              --clean \
              -o allure-report

          else

            echo "No Allure results generated."

            mkdir -p allure-report

            echo "<h1>No Allure results generated</h1>" \
              > allure-report/index.html

          fi

      # =====================================================
      # CUCUMBER REPORT
      # =====================================================

      - name: Upload Cucumber Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: auction-cucumber-report

          path: reports/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # ALLURE RAW RESULTS
      # =====================================================

      - name: Upload Allure Raw Results
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: auction-allure-results

          path: allure-results/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # ALLURE HTML REPORT
      # =====================================================

      - name: Upload Allure HTML Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: auction-allure-html-report

          path: allure-report/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # SCREENSHOTS
      # =====================================================

      - name: Upload Screenshots
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: auction-cucumber-screenshots

          path: screenshots/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # RECORDED VIDEOS
      # =====================================================

      - name: Upload Test Videos
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: auction-cucumber-videos

          path: videos/cucumber/

          retention-days: 30

          if-no-files-found: warn

      # =====================================================
      # GITHUB PAGES
      # =====================================================

      - name: Configure GitHub Pages
        if: always()

        uses: actions/configure-pages@v5

      - name: Upload Allure Report To GitHub Pages
        if: always()

        uses: actions/upload-pages-artifact@v4

        with:
          path: allure-report/

      # =====================================================
      # DISPLAY TEST RESULT
      # =====================================================

      - name: Display Auction Test Result
        if: always()

        run: |
          echo ""
          echo "============================================"
          echo "REALEY AUCTION AUTOMATION"
          echo "============================================"
          echo "Result: ${{ steps.cucumber-tests.outcome }}"
          echo "============================================"

      # =====================================================
      # FAIL TEST JOB IF CUCUMBER FAILED
      # =====================================================

      - name: Fail Job If Auction Test Failed
        if: steps.cucumber-tests.outcome == 'failure'

        run: |
          echo "Auction Cucumber test failed."

          exit 1


  # =========================================================
  # DEPLOY ALLURE REPORT
  # =========================================================

  deploy-allure:
    name: Publish Auction Allure Report

    if: always()

    needs:
      - run-auction

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report
        id: deployment

        uses: actions/deploy-pages@v4

      - name: Show Allure Report URL
        run: |
          echo ""
          echo "============================================"
          echo "AUCTION ALLURE REPORT"
          echo "============================================"
          echo "${{ steps.deployment.outputs.page_url }}"
          echo "============================================"

      - name: Add Allure Link To Job Summary
        run: |
          echo "## 📊 Realey Auction Allure Report" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Report includes:" >> "$GITHUB_STEP_SUMMARY"

          echo "- Auction Cucumber scenario results" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer 1 bidder registration and bid" >> "$GITHUB_STEP_SUMMARY"

          echo "- Buyer 2 bidder registration and winning bid" >> "$GITHUB_STEP_SUMMARY"

          echo "- Auction end wait" >> "$GITHUB_STEP_SUMMARY"

          echo "- Winning buyer settlement payment" >> "$GITHUB_STEP_SUMMARY"

          echo "- Step screenshots" >> "$GITHUB_STEP_SUMMARY"

          echo "- Recorded Playwright scenario video" >> "$GITHUB_STEP_SUMMARY"


  # =========================================================
  # FINAL STATUS
  # =========================================================

  final-status:
    name: Final Auction Test Status

    if: always()

    needs:
      - run-auction
      - deploy-allure

    runs-on: ubuntu-latest

    steps:
      - name: Workflow Summary
        run: |
          echo "Auction automation workflow completed."